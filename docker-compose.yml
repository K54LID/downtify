services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data

  telegram-bot-api:
    image: ghcr.io/bots-house/docker-telegram-bot-api:latest
    restart: unless-stopped
    environment:
      TELEGRAM_API_ID: ${TELEGRAM_API_ID}
      TELEGRAM_API_HASH: ${TELEGRAM_API_HASH}
    command:
      - --dir=/var/lib/telegram-bot-api
      - --local
    volumes:
      - bot-api-data:/var/lib/telegram-bot-api
    # No "ports:" here on purpose - the bot reaches this over Coolify's
    # internal compose network at http://telegram-bot-api:8081, and it
    # never needs to be reachable from the internet.

  bot:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      TELEGRAM_API_ROOT: "http://telegram-bot-api:8081"
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      telegram-bot-api:
        condition: service_started
    volumes:
      - downloads:/app/downloads
      - logs:/app/logs
    command: ["sh", "-c", "alembic upgrade head && python -m app.main"]

# No nginx service: the bot runs in long-polling mode (no WEBHOOK_URL set),
# so it makes outbound connections only and needs no exposed port at all.
# Coolify has its own Traefik proxy + automatic HTTPS for anything that
# does need a public domain later (e.g. if you switch to webhook mode -
# just add a domain to the "bot" service in the Coolify UI, pointing at
# WEBAPP_PORT 8080, and Coolify handles TLS for you).

volumes:
  pgdata:
  redisdata:
  bot-api-data:
  downloads:
  logs:
